<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 405" role="img" aria-labelledby="title desc">
<title id="title">Falvorn WorldOps animated hero</title><desc id="desc">Dark premium banner with an abstract autonomous world, animated agent nodes, and Falvorn WorldOps identity.</desc>
