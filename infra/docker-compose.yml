services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: worldops
      POSTGRES_USER: worldops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worldops -d worldops"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
  migrate:
    build: {context: .., dockerfile: backend/Dockerfile}
    command: ["alembic", "-c", "/srv/alembic.ini", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
    environment: &app-env
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://worldops:${POSTGRES_PASSWORD}@db:5432/worldops
      API_KEY: ${API_KEY:?Set a long API_KEY}
      READ_ONLY_API_KEY: ${READ_ONLY_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_ALLOWED_MODELS: ${LLM_ALLOWED_MODELS:-gpt-4.1-mini,gpt-4o-mini}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-}
    restart: "no"
    networks: [internal]
  api:
    build: {context: .., dockerfile: backend/Dockerfile}
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
    environment: *app-env
    ports: ["127.0.0.1:8000:8000"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/live', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      retries: 4
    networks: [internal]
  worker:
    build: {context: .., dockerfile: backend/Dockerfile}
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    depends_on:
      migrate: {condition: service_completed_successfully}
    environment: *app-env
    networks: [internal]
networks:
  internal: {}
volumes:
  postgres_data: {}
